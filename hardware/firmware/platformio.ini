; Wai probe firmware for the ESP32 core board (Jaycar XC3800)
; Build:  pio run
; Flash:  pio run -t upload
; Logs:   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
    mikalhart/TinyGPSPlus@^1.1.0

; HC-SR04 wiring diagnostic: pio run -e diag -t upload
[env:diag]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../diag/>
